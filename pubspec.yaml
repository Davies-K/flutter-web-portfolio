name: portfolio
description: Davies Kwarteng — personal portfolio built with Flutter Web.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.5.0
  google_fonts: ^8.2.1
  lucide_icons_flutter: ^4.0.3
  minimap_scrollbar: ^0.1.0
  url_launcher: ^6.3.3
  visibility_detector: ^0.4.0+2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/code/
