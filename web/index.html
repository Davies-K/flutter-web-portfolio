<body>
  <div class="loading" id="loading">
    <div class="loading-text">
      <span>A</span><span>&nbsp;</span><span>F</span><span>L</span><span>U</span><span>T</span><span>T</span><span>E</span><span>R</span><span>&nbsp;</span><span>D</span><span>E</span><span>V</span><span>&nbsp;</span><span>S</span><span>T</span><span>O</span><span>R</span><span>Y</span>
    </div>
  </div>
  <script>
    // Fade the loader out once Flutter has painted its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading');
      if (!loader) return;
      loader.classList.add('done');
      setTimeout(function () { loader.remove(); }, 700);
    });
  </script>
